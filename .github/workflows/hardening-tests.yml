name: Hardened Unturnov browser regression tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tracker-tactical.js'
      - 'airdrop-tactical.js'
      - 'tactical-enhancements.js'
      - 'team-realtime.js'
      - 'tests/tactical-hardening.spec.cjs'
      - '.github/workflows/hardening-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-player-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Start mock-tested website
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/unturnov-test-site.log 2>&1 &
      - name: Verify every player, offline edits, backups, realtime fallback
        env:
          SITE_URL: http://127.0.0.1:8765/
        run: npx playwright test tests/tactical-hardening.spec.cjs --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unturnov-hardening-errors
          path: test-results/
